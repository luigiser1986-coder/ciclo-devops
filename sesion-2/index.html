<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Release en Juego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#F4F5F5; --surface:#FFFFFF; --fg:#2C2A29; --muted:#55524F; --line:#D5D6D6;
  --yellow:#FDC82F; --cyan:#29C1E0; --green:#3A9E6F; --purple:#7A5CC4; --red:#D8242B;
  --on-yellow:#2C2A29; --on-color:#FFFFFF;
  --font:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1D1C; --surface:#2C2A29; --fg:#F4F5F5; --muted:#B9B8B6; --line:#4A4745;
  --green:#4DBB88; --purple:#9C84DD; --red:#F0575D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1D1C; --surface:#2C2A29; --fg:#F4F5F5; --muted:#B9B8B6; --line:#4A4745;
  --green:#4DBB88; --purple:#9C84DD; --red:#F0575D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(1.3rem,3.4vw,1.8rem);font-weight:800}
.score{font:500 .95rem var(--mono);color:var(--muted)}
.score b{color:var(--fg)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.now{background:var(--yellow)} .dots i.ok{background:var(--green)} .dots i.no{background:var(--red)}
.card{background:var(--surface);border-radius:20px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:20px}
.kick{font:600 .78rem var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kick .tag{background:var(--cyan);color:var(--on-yellow);padding:3px 10px;border-radius:999px}
.q{margin:0;font-size:clamp(1.4rem,3.6vw,2.2rem);font-weight:800;line-height:1.2;text-wrap:balance}
.ctx{margin:0;color:var(--muted);font-size:1.05rem;max-width:62ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.opt{position:relative;border:2px solid var(--fg);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.opt .main{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px 10px;display:flex;gap:12px;align-items:flex-start;font-size:1.1rem;font-weight:600;min-width:0}
.opt .main:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}
.opt .k{flex:none;font:800 1rem var(--font);width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .meter{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font:500 .95rem var(--mono);color:var(--muted)}
.opt .bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.opt .bar span{display:block;height:100%;width:0;background:var(--fg);transition:width .5s}
.opt .minus{font:600 .85rem var(--font);border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:2px 9px;cursor:pointer}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.opt.right .k{background:var(--green);color:#fff}
.opt.right .bar span{background:var(--green)}
.opt.wrong{opacity:.6}
.opt.wrong .bar span{background:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 1rem var(--font);padding:12px 22px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.btn.go{background:var(--yellow);color:var(--on-yellow)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem}
.why{border-left:6px solid var(--green);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.why.miss{border-color:var(--red)}
.why h2{margin:0;font-size:1.2rem}
.why p{margin:0;max-width:66ch;font-size:1.05rem}
.why .src{font:500 .85rem var(--mono);color:var(--muted)}
/* ordenar */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font:600 1rem var(--font);padding:11px 16px;border-radius:12px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.chip.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--surface))}
.line{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slot{counter-increment:s;display:flex;gap:12px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;min-height:46px;font-weight:600}
.slot::before{content:counter(s);font:500 .9rem var(--mono);color:var(--muted);width:22px}
.slot.on{border:2px solid var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.slot em{font-style:normal;font:500 .8rem var(--mono);color:var(--muted);margin-left:auto}
/* final */
.big{font-size:clamp(2.6rem,9vw,5rem);font-weight:800;line-height:1}
.miss-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.miss-list li{border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <div class="top">
    <h1>El release en juego</h1>
    <div class="score" id="score" aria-live="polite"></div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <main class="card" id="stage" aria-live="polite"></main>
</div>

<script>
(function(){
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Cada pregunta sale de lo que se vio en el release real. src = pestaña de donde sale. */
var Q=[
 {t:"Pipeline",q:"Se crea un release nuevo. ¿Qué pasa primero, sin que nadie haga nada?",
  o:["Arranca Deploy DEV","Espera la aprobación del líder","Corren las pruebas E2E","Se despliega en PDN"],a:0,
  w:"Deploy DEV tiene el trigger «After release» y no tiene aprobaciones ni gates. Apenas existe el release, arranca.",src:"Deploy DEV → Pre-deployment conditions"},
 {t:"Pipeline",q:"El Release-139 se disparó el 6/10/2026. ¿Cómo?",
  o:["Por un horario programado","Alguien lo creó a mano","Lo disparó el gate de calidad","Lo disparó el equipo de PDN"],a:1,
  w:"El pipeline no tiene schedule. En el Release-139 el disparo fue manual: alguien lo crea cuando quiere desplegar.",src:"Pipeline → Artifacts"},
 {t:"Artefactos",q:"Nadie elige versión. ¿Qué build toma el release por defecto?",
  o:["El más antiguo","El último de la rama trunk","El de la rama que se tocó más reciente","El que esté ya en QA"],a:1,
  w:"La versión por defecto es «latest from branch trunk», por ejemplo trunk.20261016.1. Los releases 145 y 146 salieron de feature/movementDownload porque alguien eligió esa rama.",src:"Pipeline → Artifacts"},
 {t:"QA (CER)",q:"Son 4 stages de pruebas E2E. ¿Cómo corren?",
  o:["Uno tras otro, en fila","En paralelo","Solo si el líder aprueba","Solo en PDN"],a:1,
  w:"E2E MQ Process Messages, AWS ProcessFile S3, RetryAnnulments y PostBalanceRunner salen en paralelo en el diagrama del pipeline.",src:"Pipeline → diagrama"},
 {t:"Paso a PDN",q:"¿Qué stage frena el release hasta que el líder de componente apruebe?",
  o:["Acceptance Test CER","Create OC","Performance Test CER","Deploy DEV"],a:1,
  w:"Create OC tiene un job agentless con una Manual Intervention: «Aprobación de líder de componente». Antes compara variables del release y después genera la orden de cambio.",src:"Tasks → Create OC"},
 {t:"Paso a PDN",q:"Una Manual Intervention pausa el release esperando a una persona. ¿Qué tipo de job la hace posible?",
  o:["Un agent job normal","Un agentless job (corre en el servidor)","Un job de Docker","Un job de Gradle"],a:1,
  w:"Se pone en un agentless job: corre en el servidor de Azure DevOps y no ocupa un agente mientras espera. Así lo usan Create OC, Smoke Test y User Validation.",src:"Tasks → Create OC / Smoke Test / User Validation"},
 {t:"Variables",q:"¿Cuál de estos grupos de variables aplica solo al stage Deploy PDN?",
  o:["base_images","bolsillos-security-istio-pdn","nu6560001_Pockets_MR_variables_dev","bolsillos_variables_mqi_qa"],a:1,
  w:"base_images tiene alcance «Release» (todo el pipeline). Los _dev son de Deploy DEV y los _qa de Deploy CER. Para Deploy PDN solo está bolsillos-security-istio-pdn.",src:"Variables → Variable groups"},
 {t:"Retention",q:"¿Cuánto tiempo se guardan los releases?",
  o:["30 días","90 días","730 días, con mínimo 25 releases","Para siempre"],a:2,
  w:"Retención de 730 días, mínimo 25 releases, con sus artefactos asociados. Es igual en todos los stages.",src:"Retention"},
 {t:"Options",q:"El último release listado es el Release-148. ¿Cómo se llama el siguiente?",
  o:["Release-149","Release-1","148.1","20261020.1"],a:0,
  w:"El formato es Release-$(rev:r). El rev:r es un contador que sube de uno en uno con cada release.",src:"Options → Release name format"},
 {t:"Debate",q:"Este release, ¿es Continuous Delivery o Continuous Deployment?",
  ctx:"Mira dónde hay personas en el camino antes de llegar a producción. Aquí se vota y se discute.",
  o:["Delivery: una persona autoriza el paso a producción","Deployment: todo es automático hasta PDN"],a:0,
  w:"Hasta QA todo corre solo. Para pasar a PDN hay una persona: la aprobación del líder en Create OC. Después de Deploy PDN hay otras dos pausas manuales, Smoke Test y User Validation. Se parece más a Continuous Delivery.",src:"Tasks + Pipeline"}
];
var ORDER=[["Deploy DEV",""],["Deploy CER","QA"],["Acceptance Test CER","QA"],["SRE","QA"],["4 stages E2E","en paralelo"],["Security E2E","QA"],["Performance Test CER","QA"],["Create OC","manual"],["Deploy PDN","PDN"],["Smoke Test","manual"],["User Validation","manual"]];
var N=Q.length+1; /* + ronda de ordenar */

var st={i:0,votes:Q.map(function(q){return q.o.map(function(){return 0})}),shown:Q.map(function(){return false}),
  ord:{pos:0,errs:0,done:false,seed:null}};
function total(i){return st.votes[i].reduce(function(a,b){return a+b},0)}
function winner(i){var v=st.votes[i],m=Math.max.apply(null,v);if(!m)return -1;var w=v.indexOf(m);return v.filter(function(x){return x===m}).length>1?-1:w}
function hit(i){return st.shown[i]&&winner(i)===Q[i].a}

function dots(){
  $("dots").innerHTML=Array.apply(null,{length:N}).map(function(_,i){
    var c="";if(i===st.i)c="now";else if(i<Q.length&&st.shown[i])c=hit(i)?"ok":"no";else if(i===Q.length&&st.ord.done)c=st.ord.errs?"no":"ok";
    return '<i class="'+c+'"></i>'}).join("");
  var ok=0,sh=0;Q.forEach(function(_,i){if(st.shown[i]){sh++;if(hit(i))ok++}});
  $("score").innerHTML="La sala: <b>"+ok+"</b> de "+sh+" acertadas";
}

function render(){
  dots();
  if(st.i<Q.length)return renderQ();
  if(st.i===Q.length)return renderOrder();
  renderEnd();
}
function nav(next){
  return '<div class="row"><button class="btn alt" id="prev"'+(st.i===0?' disabled':'')+'>Anterior</button>'+next+'</div>'}
function bindNav(){var p=$("prev");if(p)p.onclick=function(){go(st.i-1)}}
function go(i){st.i=Math.max(0,Math.min(Q.length+1,i));render();window.scrollTo(0,0)}

function renderQ(){
  var q=Q[st.i],sh=st.shown[st.i],v=st.votes[st.i],tot=total(st.i),w=winner(st.i);
  var h='<div class="kick"><span class="tag">Ronda '+(st.i+1)+' de '+N+'</span>'+esc(q.t)+'</div><h2 class="q">'+esc(q.q)+'</h2>'+(q.ctx?'<p class="ctx">'+esc(q.ctx)+'</p>':'');
  h+='<div class="opts">'+q.o.map(function(o,k){
    var cls="opt"+(sh?(k===q.a?" right":" wrong"):""),pct=tot?Math.round(v[k]/tot*100):0;
    return '<div class="'+cls+'"><button class="main" data-k="'+k+'"'+(sh?' disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span class="t">'+esc(o)+'</span></button>'+
     '<div class="meter"><div class="bar"><span style="width:'+(sh?pct:0)+'%"></span></div><span>'+v[k]+(sh&&tot?' · '+pct+'%':'')+'</span>'+(sh?'':'<button class="minus" data-m="'+k+'" aria-label="Quitar un voto a '+"ABCD"[k]+'">−1</button>')+'</div></div>'}).join("")+'</div>';
  if(!sh){
    h+='<p class="hint">Cada mano levantada es un clic en su opción (o la tecla 1, 2, 3, 4). Cuando todos voten, revela.</p>';
    h+=nav('<button class="btn go" id="rev">Revelar respuesta ('+tot+' votos)</button>');
  }else{
    var good=w===q.a;
    h+='<div class="why'+(good?'':' miss')+'"><h2>'+(tot?(good?'La sala acertó':(w<0?'La sala quedó dividida':'La sala votó '+"ABCD"[w]+' y no era')):'Nadie votó')+'. Respuesta: '+"ABCD"[q.a]+'</h2><p>'+esc(q.w)+'</p><span class="src">Se ve en: '+esc(q.src)+'</span></div>';
    h+=nav('<button class="btn go" id="nx">'+(st.i===Q.length-1?'A la última ronda':'Siguiente')+'</button>');
  }
  $("stage").innerHTML=h;bindNav();
  var s=$("stage");
  Array.prototype.forEach.call(s.querySelectorAll(".main"),function(b){b.onclick=function(){st.votes[st.i][+b.dataset.k]++;renderQ_keep()}});
  Array.prototype.forEach.call(s.querySelectorAll(".minus"),function(b){b.onclick=function(){var k=+b.dataset.m;if(st.votes[st.i][k])st.votes[st.i][k]--;renderQ_keep()}});
  if($("rev"))$("rev").onclick=function(){st.shown[st.i]=true;render()};
  if($("nx"))$("nx").onclick=function(){go(st.i+1)};
}
function renderQ_keep(){var y=window.scrollY;renderQ();window.scrollTo(0,y)}

/* ronda final: armar el release en orden */
function shuffle(a,seed){var r=a.slice(),s=seed;for(var i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;var j=Math.floor(s/233280*(i+1));var t=r[i];r[i]=r[j];r[j]=t}return r}
function renderOrder(){
  var o=st.ord;if(o.seed==null)o.seed=Math.floor(Math.random()*1000)+1;
  var mix=shuffle(ORDER.map(function(_,i){return i}),o.seed);
  var h='<div class="kick"><span class="tag">Ronda '+N+' de '+N+'</span>Arma el release</div><h2 class="q">Pónganlos en el orden en que corren, desde DEV hasta User Validation</h2>';
  h+='<p class="ctx">La sala grita el siguiente y se toca. Si se equivoca, se marca y se cuenta el error.</p>';
  h+='<div class="chips">'+mix.map(function(k){var used=k<o.pos;return '<button class="chip" data-k="'+k+'"'+(used||o.done?' disabled':'')+'>'+esc(ORDER[k][0])+'</button>'}).join("")+'</div>';
  h+='<div class="line">'+ORDER.map(function(x,k){return k<o.pos?'<div class="slot on">'+esc(x[0])+(x[1]?'<em>'+esc(x[1])+'</em>':'')+'</div>':'<div class="slot"></div>'}).join("")+'</div>';
  if(o.done)h+='<div class="why'+(o.errs?' miss':'')+'"><h2>'+(o.errs?'Armado con '+o.errs+(o.errs===1?' error':' errores'):'Armado sin errores')+'</h2><p>Hasta QA todo es automático. Create OC es la primera pausa manual y lleva a Deploy PDN; después vienen Smoke Test y User Validation.</p><span class="src">Se ve en: Retention (orden de los stages) y Tasks</span></div>';
  else h+='<p class="hint">Errores hasta ahora: '+o.errs+'</p>';
  h+=nav('<button class="btn alt" id="rs">Reordenar</button><button class="btn go" id="fin"'+(o.done?'':' disabled')+'>Ver resultado</button>');
  $("stage").innerHTML=h;bindNav();
  Array.prototype.forEach.call($("stage").querySelectorAll(".chip"),function(b){b.onclick=function(){
    var k=+b.dataset.k;if(k===o.pos){o.pos++;if(o.pos===ORDER.length)o.done=true;var y=scrollY;render();scrollTo(0,y)}
    else{o.errs++;b.classList.add("bad");setTimeout(function(){var y=scrollY;render();scrollTo(0,y)},reduce?0:450)}}});
  $("rs").onclick=function(){o.pos=0;o.errs=0;o.done=false;o.seed=null;render()};
  $("fin").onclick=function(){go(Q.length+1)};
}

function renderEnd(){
  var ok=0,miss=[];Q.forEach(function(q,i){if(hit(i))ok++;else miss.push(i)});
  var h='<div class="kick"><span class="tag">Resultado</span>La sala</div><div class="big">'+ok+' de '+Q.length+'</div><p class="ctx">preguntas acertadas por votación.'+(st.ord.done?' Armaron el release con '+st.ord.errs+(st.ord.errs===1?' error.':' errores.'):'')+'</p>';
  if(miss.length){h+='<h2 class="q" style="font-size:1.3rem">Para repasar</h2><ul class="miss-list">'+miss.map(function(i){return '<li><b>'+esc(Q[i].q)+'</b><br><span class="hint">'+esc(Q[i].o[Q[i].a])+' — '+esc(Q[i].w)+'</span></li>'}).join("")+'</ul>'}
  else h+='<p class="ctx">No hay nada que repasar.</p>';
  h+=nav('<button class="btn alt" id="again">Jugar de nuevo</button>');
  $("stage").innerHTML=h;bindNav();
  $("again").onclick=function(){st.votes=Q.map(function(q){return q.o.map(function(){return 0})});st.shown=Q.map(function(){return false});st.ord={pos:0,errs:0,done:false,seed:null};go(0)};
}

document.addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(st.i<Q.length&&!st.shown[st.i]&&/^[1-4]$/.test(e.key)&&+e.key<=Q[st.i].o.length){st.votes[st.i][+e.key-1]++;renderQ_keep()}
  else if(e.key==="ArrowRight"&&st.i<Q.length&&st.shown[st.i])go(st.i+1);
  else if(e.key==="ArrowLeft")go(st.i-1);
  else if(e.key==="Enter"&&e.target.tagName!=="BUTTON"&&st.i<Q.length&&!st.shown[st.i]){st.shown[st.i]=true;render()}
});
render();
})();
</script>
</body></html>
